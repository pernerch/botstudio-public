# Install as .github/workflows/catalog-games.yml in pernerch/botstudio-catalog.
name: Register catalog Games

on:
  issues:
    types: [opened, reopened]

permissions: {}

concurrency:
  group: game-registration-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'pernerch/botstudio-catalog' && startsWith(github.event.issue.title, '[BotStudio Game] ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted catalog automation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: automation
      - name: Register from freshly read issue data
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 -I automation/catalog_automation.py register-game --issue "$ISSUE_NUMBER"

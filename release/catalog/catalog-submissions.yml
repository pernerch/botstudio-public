# Install as .github/workflows/catalog-submissions.yml in pernerch/botstudio-catalog.
name: Validate and publish catalog contributions

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Existing PR number to validate/publish (also permits merged PR recovery)
        required: true
        type: number

permissions: {}

concurrency:
  group: catalog-publication
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'pernerch/botstudio-catalog'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted catalog automation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: automation
      - name: Independently validate exact PR data (skip verified registry-only bot PRs)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: python3 -I automation/catalog_automation.py validate --pr "$PR_NUMBER"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted catalog automation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: automation
      - name: Revalidate, merge exact head and publish checked archive (skip verified registry-only bot PRs)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: python3 -I automation/catalog_automation.py publish --pr "$PR_NUMBER"
